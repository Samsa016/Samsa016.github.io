name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: в проде важна последняя версия, а не все подряд.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версию не указываем: она уже задана полем packageManager в package.json,
      # и второе указание роняет шаг ошибкой о конфликте версий.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Адрес нужен на сборке: canonical, hreflang и sitemap пекутся в статику.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://samsa016.github.io' }}

      # Данные заказчиков не должны уехать в публичный репозиторий вместе с сайтом.
      # Сам денилист хранится секретом: в открытом виде он расшифровывал бы
      # обезличенные кейсы. Без секрета шаг падает — это нужное поведение.
      - run: pnpm privacy
        env:
          PRIVACY_CLIENTS: ${{ secrets.PRIVACY_CLIENTS }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
